# Uso local. A senha do banco vale só nesta rede interna: a porta do PostgreSQL não é publicada.
# O Caddy publica o build estático e encaminha /api. A API não aplica migration ao subir.

name: aralu

services:
  postgres:
    image: postgres:16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
    environment:
      POSTGRES_USER: aralu
      POSTGRES_PASSWORD: aralu
      POSTGRES_DB: aralu
    volumes:
      - banco:/var/lib/postgresql/data
    networks:
      - interna
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aralu -d aralu"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    image: postgres:16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
    environment:
      PGPASSWORD: aralu
      PGHOST: postgres
      PGUSER: aralu
      PGDATABASE: aralu
    volumes:
      - ./deploy/schema.sql:/schema.sql:ro
    command: ["psql", "-v", "ON_ERROR_STOP=1", "-f", "/schema.sql"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - interna
    restart: "no"

  api:
    build:
      context: .
      dockerfile: src/backend/Project.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=aralu;Username=aralu;Password=aralu
      # Segredo só desta stack local. Em produção vem de variável de ambiente e não entra no git.
      Jwt__Secret: local-apenas-aralu-jwt-segredo-32
      Jwt__Issuer: aralu
      Jwt__Audience: aralu
      Jwt__ExpiryHours: "8"
      DataProtection__KeysPath: /keys
      Storage__Root: /storage
      PublicUrl: http://localhost:8080
      Email__Username: ${EMAIL_USERNAME:-}
      Email__Password: ${EMAIL_PASSWORD:-}
      Email__From: ${EMAIL_FROM:-}
      Email__TenantId: ${EMAIL_TENANT_ID:-}
      Email__ClientId: ${EMAIL_CLIENT_ID:-}
      Email__ClientSecret: ${EMAIL_CLIENT_SECRET:-}
      # Cria o administrador inicial quando o .env define BOOTSTRAP_ENABLED=true (mesmo padrão do compose de produção).
      Bootstrap__Enabled: ${BOOTSTRAP_ENABLED:-false}
      Bootstrap__AdminEmail: ${BOOTSTRAP_ADMIN_EMAIL:-}
      Bootstrap__AdminPassword: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      ForwardedHeaders__KnownNetworks__0: 172.16.0.0/12
      ForwardedHeaders__KnownNetworks__1: 10.0.0.0/8
      ForwardedHeaders__KnownNetworks__2: 192.168.0.0/16
    volumes:
      - storage:/storage
      - chaves:/keys
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - interna
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8080'"]
      interval: 5s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: .
      dockerfile: src/frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - interna

volumes:
  banco:
  storage:
  chaves:

networks:
  interna:
