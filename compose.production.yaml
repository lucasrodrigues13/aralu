# Produção e staging usam este mesmo arquivo. Segredos vêm do .env ao lado dele, que não entra no Git.
# O workflow publica a branch main em /opt/aralu e a branch staging em /opt/aralu-staging, e roda:
#   docker compose -p <projeto> -f compose.production.yaml up -d --build --remove-orphans --wait
# O nome do projeto (aralu ou aralu-staging) separa containers, rede e volumes, inclusive o banco.

name: aralu

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aralu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-aralu}
    volumes:
      - banco:/var/lib/postgresql/data
    networks:
      - interna
    mem_limit: ${POSTGRES_MEM_LIMIT:-1g}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aralu} -d ${POSTGRES_DB:-aralu}"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-aralu}
      PGDATABASE: ${POSTGRES_DB:-aralu}
    volumes:
      - ./deploy/schema.sql:/schema.sql:ro
    command: ["psql", "-v", "ON_ERROR_STOP=1", "-f", "/schema.sql"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - interna
    restart: "no"

  api:
    build:
      context: .
      dockerfile: src/backend/Project.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB:-aralu};Username=${POSTGRES_USER:-aralu};Password=${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      Jwt__Secret: ${JWT_SECRET:?defina JWT_SECRET no .env}
      Jwt__Issuer: aralu
      Jwt__Audience: aralu
      Jwt__ExpiryHours: "8"
      DataProtection__KeysPath: /keys
      Storage__Root: /storage
      App__Environment: ${APP_ENV:-production}
      PublicUrl: ${PUBLIC_SCHEME:-http}://${DOMAIN:?defina DOMAIN no .env}
      Cors__Origins__0: ${PUBLIC_SCHEME:-http}://${DOMAIN:?defina DOMAIN no .env}
      Email__Host: ${EMAIL_HOST:-smtp.office365.com}
      Email__Port: ${EMAIL_PORT:-587}
      Email__Username: ${EMAIL_USERNAME:?defina EMAIL_USERNAME no .env}
      Email__Password: ${EMAIL_PASSWORD:-}
      Email__TenantId: ${EMAIL_TENANT_ID:-}
      Email__ClientId: ${EMAIL_CLIENT_ID:-}
      Email__ClientSecret: ${EMAIL_CLIENT_SECRET:-}
      Email__From: ${EMAIL_FROM:?defina EMAIL_FROM no .env}
      Email__StartTls: ${EMAIL_STARTTLS:-true}
      # Asaas (SPEC-062 parte B). Staging: sandbox e diagnóstico no navegador ligado. Produção: https://api.asaas.com e diagnóstico desligado.
      Asaas__BaseUrl: ${ASAAS_BASE_URL:-https://api-sandbox.asaas.com}
      Asaas__ApiKey: ${ASAAS_API_KEY:-}
      Asaas__WebhookToken: ${ASAAS_WEBHOOK_TOKEN:-}
      Asaas__DiagnosticoNoNavegador: ${ASAAS_DIAGNOSTICO:-false}
      Bootstrap__Enabled: ${BOOTSTRAP_ENABLED:-false}
      Bootstrap__AdminEmail: ${BOOTSTRAP_ADMIN_EMAIL:-}
      Bootstrap__AdminPassword: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      # Só a rede interna fixa (o Caddy do frontend); ver networks.interna.
      ForwardedHeaders__KnownNetworks__0: ${DOCKER_SUBNET:?defina DOCKER_SUBNET no .env}
    volumes:
      - storage:/storage
      - chaves:/keys
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - interna
    mem_limit: ${API_MEM_LIMIT:-1g}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8080'"]
      interval: 5s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: .
      dockerfile: src/frontend/Dockerfile
    environment:
      SITE_ADDRESS: :80
    ports:
      # As portas 80/443 da VPS são do proxy em /opt/proxy (repo jm-reboques-lp, infra/proxy).
      # O frontend só escuta no loopback; o proxy repassa o tráfego HTTP para cá.
      # Produção usa 8081 e staging 8082 (FRONTEND_PORT no .env).
      - "127.0.0.1:${FRONTEND_PORT:-8081}:80"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    networks:
      - interna
    restart: unless-stopped

volumes:
  banco:
  storage:
  chaves:
  caddy_data:
  caddy_config:

networks:
  interna:
    ipam:
      config:
        # Produção 172.30.0.0/24, staging 172.31.0.0/24 (A06-001).
        - subnet: ${DOCKER_SUBNET:?defina DOCKER_SUBNET no .env}
